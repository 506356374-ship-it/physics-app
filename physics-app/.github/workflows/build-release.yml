name: Build Android Signed Release APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies & sync
        run: npm ci && npx cap sync android

      - name: Decode keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build signed release APK
        working-directory: android
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS:   ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        working-directory: android/app/build/outputs/apk/release
        run: |
          apksigner verify --verbose *.apk | head -5
          echo "--- APK info ---"
          ls -lh *.apk

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: physics-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('release-{0}', github.run_number) }}
          name: Release ${{ github.ref_name || github.run_number }}
          files: android/app/build/outputs/apk/release/*.apk
          draft: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

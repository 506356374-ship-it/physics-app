name: Web APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build WebView APK
        run: |
          mkdir -p app/src/main/assets/app app/src/main/java/com/physics/app
          cp -r * app/src/main/assets/app/ 2>/dev/null || true
          echo 'apply plugin: "com.android.application"
android { compileSdkVersion 33; defaultConfig { minSdkVersion 21; targetSdkVersion 33; versionCode 1; versionName "1.0" } }' > app/build.gradle
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.physics.app"><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="true" android:label="Physics" android:theme="@android:style/Theme.NoTitleBar"><activity android:name=".MainActivity"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
          echo 'package com.physics.app;import android.app.*;import android.os.*;import android.webkit.*;public class MainActivity extends Activity{@Override protected void onCreate(Bundle s){super.onCreate(s);WebView w=new WebView(this);WebSettings ws=w.getSettings();ws.setJavaScriptEnabled(true);ws.setAllowFileAccess(true);w.loadUrl("file:///android_asset/app/index.html");setContentView(w);}}' > app/src/main/java/com/physics/app/MainActivity.java
          yes | sdkmanager "platforms;android-33" "build-tools;33.0.0" >/dev/null 2>&1 || true
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: physics-web-apk
          path: app/build/outputs/apk/debug/*.apk

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android SDK & Build
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y unzip rsync imagemagick fonts-wqy-zenhei
          fc-cache -fv || true

          export ANDROID_SDK_ROOT=/opt/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-33" "build-tools;33.0.0"

          BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/33.0.0
          PLATFORM_JAR=$ANDROID_SDK_ROOT/platforms/android-33/android.jar

          BUILD_DIR=/tmp/apk_build
          rm -rf $BUILD_DIR
          mkdir -p $BUILD_DIR/src/main/assets/www \
                   $BUILD_DIR/src/main/java/com/physics/app \
                   $BUILD_DIR/src/main/res/mipmap-mdpi \
                   $BUILD_DIR/src/main/res/mipmap-hdpi \
                   $BUILD_DIR/src/main/res/mipmap-xhdpi \
                   $BUILD_DIR/src/main/res/mipmap-xxhdpi \
                   $BUILD_DIR/src/main/res/mipmap-xxxhdpi \
                   $BUILD_DIR/obj $BUILD_DIR/build

          rsync -a --exclude='.git' --exclude='.github' --exclude='android_build' ./ $BUILD_DIR/src/main/assets/www/

          # 生成“琴”字图标（蓝底白字），多分辨率
          FONT="/usr/share/fonts/truetype/wqy/wqy-zenhei.ttc"
          convert -background "#2E86DE" -fill white -font "$FONT" -gravity center \
            -pointsize 48 -extent 48x48 label:"琴" $BUILD_DIR/src/main/res/mipmap-mdpi/ic_launcher.png
          convert -background "#2E86DE" -fill white -font "$FONT" -gravity center \
            -pointsize 72 -extent 72x72 label:"琴" $BUILD_DIR/src/main/res/mipmap-hdpi/ic_launcher.png
          convert -background "#2E86DE" -fill white -font "$FONT" -gravity center \
            -pointsize 96 -extent 96x96 label:"琴" $BUILD_DIR/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert -background "#2E86DE" -fill white -font "$FONT" -gravity center \
            -pointsize 144 -extent 144x144 label:"琴" $BUILD_DIR/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert -background "#2E86DE" -fill white -font "$FONT" -gravity center \
            -pointsize 192 -extent 192x192 label:"琴" $BUILD_DIR/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > $BUILD_DIR/src/main/AndroidManifest.xml <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.physics.app">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:allowBackup="true" android:label="物理掌中学"
              android:icon="@mipmap/ic_launcher"
              android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name=".MainActivity">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST

          cat > $BUILD_DIR/src/main/java/com/physics/app/MainActivity.java <<'JAVA'
          package com.physics.app;
          import android.app.*;
          import android.os.*;
          import android.webkit.*;
          public class MainActivity extends Activity{
            @Override protected void onCreate(Bundle s){
              super.onCreate(s);
              WebView w=new WebView(this);
              WebSettings ws=.getSettings();
              ws.setJavaScriptEnabled(true);
              ws.setAllowFileAccess(true);
              w.loadUrl("file:///android_asset/www/index.html");
              setContentView(w);
            }
          }
          JAVA

          echo "--- Compiling Java ---"
          javac -d $BUILD_DIR/obj -cp "$PLATFORM_JAR" $BUILD_DIR/src/main/java/com/physics/app/MainActivity.java

          CLASS_FILE=$BUILD_DIR/obj/com/physics/app/MainActivity.class
          if [ ! -f "$CLASS_FILE" ]; then
            echo "ERROR: $CLASS_FILE not found! Java compilation failed."
            exit 1
          fi

          echo "--- Converting to Dex (d8) ---"
          $BUILD_TOOLS/d8 --output $BUILD_DIR/build $CLASS_FILE

          echo "--- Packaging APK (with icon) ---"
          $BUILD_TOOLS/aapt package -f \
            -M $BUILD_DIR/src/main/AndroidManifest.xml \
            -S $BUILD_DIR/src/main/res \
            -A $BUILD_DIR/src/main/assets/www \
            -I $PLATFORM_JAR \
            -F $BUILD_DIR/build/unsigned.apk

          cd $BUILD_DIR/build
          $BUILD_TOOLS/aapt add unsigned.apk classes.dex || true
          cd $GITHUB_WORKSPACE

          echo "--- Signing APK ---"
          keytool -genkey -v -keystore $BUILD_DIR/debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          $BUILD_TOOLS/apksigner sign --ks $BUILD_DIR/debug.keystore --ks-pass pass:android \
            --out $BUILD_DIR/build/physics-app.apk $BUILD_DIR/build/unsigned.apk

          cp $BUILD_DIR/build/physics-app.apk $GITHUB_WORKSPACE/app-debug.apk
          ls -lh $GITHUB_WORKSPACE/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: physics-web-apk
          path: app-debug.apk
